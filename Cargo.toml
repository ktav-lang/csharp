[workspace]
resolver = "2"
members = ["crates/cabi"]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ktav-lang/csharp"
rust-version = "1.71"

[workspace.dependencies]
# Подготовка 0.9: immutable core pin с source-edit и ABI 2; пакет ещё не опубликован.
ktav = { git = "https://github.com/ktav-lang/rust", rev = "8b6b45ffbd9e50e1588e8ab6b1ae5d422bbe8910" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
debug = false
overflow-checks = false
incremental = false
panic = "abort"
