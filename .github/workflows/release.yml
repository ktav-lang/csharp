name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build without publishing"
        default: "false"
      tag:
        description: "Release tag to publish when replaying from a branch"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  # ------------------------------------------------------------------
  # Cross-compile the cdylib for six platforms. Each job uploads two
  # artifacts:
  #   - a uniquely-named GitHub Release asset (matches NativeLoader.cs)
  #   - the same binary keyed by RID, for the NuGet packing job
  # ------------------------------------------------------------------
  build-native:
    uses: ./.github/workflows/native-distribution.yml
    with:
      source-ref: ${{ github.sha }}

  # ------------------------------------------------------------------
  # Pack the NuGet with all six native binaries laid out under
  # runtimes/<rid>/native/.
  # ------------------------------------------------------------------
  pack:
    needs: [build-native]
    uses: ./.github/workflows/nuget-distribution.yml
    with:
      source-ref: ${{ github.sha }}

  # ------------------------------------------------------------------
  # Attach the six native binaries + the NuGet to the GitHub Release.
  # Push the NuGet to nuget.org for a tag push or an explicit replay.
  # ------------------------------------------------------------------
  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: [pack]
    if: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) && inputs.dry-run != 'true' }}
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Ktav
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Require accepted CI and the exact tag target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          test "$target" = "$GITHUB_SHA" || { echo 'tag does not match the built commit' >&2; exit 1; }
          accepted="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI.yml \
            --commit "$GITHUB_SHA" --status success --limit 20 --json databaseId --jq 'length')"
          test "$accepted" -gt 0 || { echo 'no successful full CI for this commit' >&2; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      - name: List artifacts
        run: ls -la release-assets/ nupkg/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*
            nupkg/*.nupkg
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Log in to NuGet with OIDC
        if: inputs.dry-run != 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: phpcraftdream

      - name: Push to NuGet
        if: inputs.dry-run != 'true'
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
